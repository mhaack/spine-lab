<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Regal ordnen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Hanken+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D6A24A}a:hover{color:#E8BC6A}
button:focus-visible,a:focus-visible{outline:2px solid #D6A24A;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #120F0D; color: #F2EBDF; font-family: 'Hanken Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0">
    <a href="05-Regal.dc.html" aria-label="Zurück zum Regal" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #2F2924; display: flex; align-items: center; justify-content: center; color: #F2EBDF">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Regal ordnen</h1>
    <span style="width: 44px; height: 44px"></span>
  </div>
  <div style="padding-top: 22px">
    <dc-import name="Shelf" width="390" rows="2" k="0.62" seed="0" theme="lesesaal" light="lichterkette" deco="stuetze,katze" covers="{{ true }}" sort="{{sort}}" hint-size="390px,322px"></dc-import>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 20px 20px 0; padding: 4px; border-radius: 14px; background: #1C1815">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
      <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 40px; border: 0; border-radius: 10px; background: {{m.bg}}; color: {{m.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{m.label}}</button>
    </sc-for>
  </div>
  <sc-if value="{{auto}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 0">
      <sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
        <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 14px; border: {{o.border}}; background: #1C1815; color: #F2EBDF; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 18px; height: 18px; flex: none; box-sizing: border-box; border-radius: 9px; border: 2px solid {{o.dotBorder}}; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.dot}}"></span></span>
          <span style="flex: 1; font-size: 15px; font-weight: 600">{{o.label}}</span>
          <span style="font-size: 13px; color: #A3978A">{{o.hint}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{manual}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 0">
      <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #1C1815; border: 1px solid #2F2924">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; color: #D6A24A"><path d="M9 11 V5.5 a1.5 1.5 0 0 1 3 0 V11 M12 10 V4.5 a1.5 1.5 0 0 1 3 0 V11 M15 10.5 a1.5 1.5 0 0 1 3 0 V15 a6 6 0 0 1 -6 6 h-1 a6 6 0 0 1 -5 -2.7 L4 15 a1.5 1.5 0 0 1 2.5 -1.6 L9 16 V11" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-size: 14px; line-height: 1.45; color: #C9BEB0">Halte ein Buch gedrückt und zieh es an seinen Platz. Cover, Katze und Buchstützen verschiebst du genauso.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A3978A">Neue Bücher</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="true" style="height: 46px; border-radius: 12px; border: 2px solid #D6A24A; background: transparent; color: #F2EBDF; font-family: inherit; font-size: 14px; font-weight: 600">Passend einreihen</button>
          <button type="button" aria-pressed="false" style="height: 46px; border-radius: 12px; border: 1px solid #2F2924; background: transparent; color: #C9BEB0; font-family: inherit; font-size: 14px; font-weight: 600">Ans Ende stellen</button>
        </div>
      </div>
    </div>
  </sc-if>
  <a href="05-Regal.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 34px; height: 56px; border-radius: 28px; background: #F2EBDF; color: #120F0D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Fertig</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'auto', sort: 'farbe' };
  }
  renderVals() {
    const s = this.state;
    const modes = [['auto', 'Automatisch'], ['manual', 'Von Hand']].map(([key, label]) => {
      const on = s.mode === key;
      return { label, pressed: on, pick: () => this.setState({ mode: key }), bg: on ? '#F2EBDF' : 'transparent', color: on ? '#120F0D' : '#C9BEB0' };
    });
    const SORTS = [
      ['farbe', 'Nach Farbe', 'Regenbogen'],
      ['autor', 'Nach Autor', 'A bis Z'],
      ['hoehe', 'Nach Höhe', 'groß nach klein'],
      ['keine', 'Zuletzt hinzugefügt', 'neu zuerst']
    ];
    const sorts = SORTS.map(([key, label, hint]) => {
      const on = s.sort === key;
      return {
        label, hint, pressed: on, pick: () => this.setState({ sort: key }),
        border: on ? '2px solid #D6A24A' : '1px solid #2F2924',
        dotBorder: on ? '#D6A24A' : '#5A5047', dot: on ? '#D6A24A' : 'transparent'
      };
    });
    return { modes, sorts, auto: s.mode === 'auto', manual: s.mode === 'manual', sort: s.mode === 'auto' ? s.sort : 'keine' };
  }
}
</script>
</body>
</html>
